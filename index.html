
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística Bodega | Gestión de Arribos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes flashEffect {
            0% { background: rgba(255,255,255,0); }
            50% { background: rgba(255,255,255,0.8); }
            100% { background: rgba(255,255,255,0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .flash-active { animation: flashEffect 0.4s ease-out; }
        
        #reader video {
            border-radius: 24px;
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        #reader { border: none !important; background: #000; }
        
        /* Retícula de Enfoque Adaptativa */
        .focus-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 320px;
            height: 120px;
            pointer-events: none;
            z-index: 45;
            transition: all 0.3s ease;
        }
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 4px solid rgba(255,255,255,0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Color Verde cuando detecta código en el área */
        .detecting .corner {
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            width: 30px;
            height: 30px;
        }
        .corner-tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
        .corner-br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }

        .shutter-btn {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 0 4px rgba(255, 255, 255, 0.1);
        }
        
        #reader__dashboard { display: none !important; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-indigo-500 overflow-x-hidden">

    <!-- PANTALLA DE CONFIGURACIÓN SIMPLIFICADA -->
    <div id="config-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-md bg-gray-800 rounded-[2.5rem] shadow-2xl p-8 border border-gray-700">
            <h1 class="text-3xl font-black text-center mb-2 tracking-tight">Terminal Bodega</h1>
            <p class="text-center text-gray-400 mb-8 text-sm">Ingresa el Token para activar la unidad</p>
            
            <form id="config-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2 px-1">Personal Access Token (PAT)</label>
                    <input type="password" id="pat" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-2xl p-5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="pat...">
                    <p class="mt-2 text-[9px] text-gray-600 px-1 italic">* Los IDs de Base y Tabla ya están configurados internamente.</p>
                </div>
                
                <div id="config-error" class="hidden p-4 bg-red-900/30 border border-red-700/50 text-red-400 rounded-2xl text-[10px] text-center font-bold"></div>
                
                <button type="submit" class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl transition-all shadow-xl uppercase tracking-widest text-[11px]">
                    Activar Terminal
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-screen" class="hidden min-h-screen flex flex-col p-4 max-w-lg mx-auto">
        <header class="flex justify-between items-center mb-4 px-2">
            <div class="flex flex-col">
                <h1 class="text-2xl font-black tracking-tighter uppercase">Bodega<span class="text-indigo-500">Pro</span></h1>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-[0.2em]">Logística Activa</p>
            </div>
            <button id="btn-clear-config" class="text-[9px] font-black text-gray-500 hover:text-red-400 uppercase tracking-widest border border-gray-800 px-5 py-2 rounded-full bg-black/40">
                Cerrar Sesión
            </button>
        </header>

        <main class="flex-grow flex flex-col bg-gray-800/50 rounded-[2.5rem] border border-gray-700/50 shadow-2xl overflow-hidden backdrop-blur-sm">
            <div class="flex bg-gray-950/50 p-1.5 m-4 rounded-[1.5rem] border border-gray-700/30">
                <button id="tab-scanner" class="flex-1 py-3 font-black text-[10px] uppercase tracking-widest rounded-xl transition-all bg-indigo-600 text-white shadow-lg">Cámara</button>
                <button id="tab-manual" class="flex-1 py-3 font-black text-[10px] uppercase tracking-widest rounded-xl transition-all text-gray-500 hover:text-white">Pendientes</button>
            </div>

            <div class="px-5 pb-6 flex-grow flex flex-col relative">
                <div id="message-container"></div>

                <div id="section-scanner" class="flex-grow flex flex-col">
                    <div id="reader-container" class="w-full aspect-[4/3] relative bg-black rounded-[2rem] overflow-hidden border border-gray-700 shadow-2xl">
                        <div id="reader" class="w-full h-full"></div>
                        
                        <div id="reticle" class="focus-frame">
                            <div class="corner corner-tl"></div>
                            <div class="corner corner-tr"></div>
                            <div class="corner corner-bl"></div>
                            <div class="corner corner-br"></div>
                        </div>

                        <div id="flash-layer" class="absolute inset-0 pointer-events-none z-40"></div>

                        <div id="scanner-placeholder" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-50">
                            <button id="btn-start-camera" class="bg-indigo-600 px-8 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest">
                                Iniciar Cámara
                            </button>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-col items-center gap-4">
                        <button id="btn-capture" class="shutter-btn bg-white active:scale-90 text-indigo-600 w-20 h-20 rounded-full flex items-center justify-center transition-all">
                            <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121A2 2 0 0011.172 3H8.828a2 2 0 00-1.414.586L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                        </button>
                        <p class="text-gray-500 text-[9px] font-black uppercase tracking-[0.3em]">Centrar código y capturar</p>
                    </div>
                </div>

                <div id="section-manual" class="hidden flex-grow flex flex-col">
                    <div class="mb-4">
                        <input type="text" id="manual-search-input" class="w-full bg-gray-950/50 border border-gray-700 text-white rounded-2xl p-5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder-gray-700" placeholder="Buscar ID de caja...">
                    </div>
                    <div class="flex-grow bg-gray-950/30 rounded-3xl border border-gray-700/50 flex flex-col overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-700/50 flex justify-between items-center">
                            <h3 class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Pendientes</h3>
                            <span id="count-badge" class="bg-indigo-600/10 text-indigo-400 text-[9px] px-3 py-1 rounded-full font-black border border-indigo-500/20">0</span>
                        </div>
                        <ul id="suggestions-list" class="overflow-y-auto max-h-[40vh] divide-y divide-gray-800/30"></ul>
                    </div>
                </div>

                <div id="confirmation-zone" class="hidden absolute inset-x-5 top-0 bottom-6 z-[60] animate-fade-in">
                    <div class="h-full bg-gray-900 border border-indigo-500/30 p-8 rounded-[2.5rem] flex flex-col items-center justify-center text-center shadow-2xl">
                        <div class="w-16 h-16 bg-indigo-600/10 text-indigo-500 rounded-full flex items-center justify-center mb-6">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <p class="text-indigo-400 text-[9px] font-black uppercase tracking-[0.5em] mb-4">Caja Lista</p>
                        <h2 id="found-box-id" class="text-2xl font-black text-white mb-10 tracking-tighter break-all">BOX_ID</h2>
                        <div class="w-full space-y-4">
                            <button id="btn-confirm-arribo" class="w-full py-5 bg-green-600 hover:bg-green-500 text-white font-black text-lg rounded-2xl transition-all shadow-xl uppercase tracking-widest active:scale-95">
                                Confirmar Ingreso
                            </button>
                            <button id="btn-cancel-confirmation" class="w-full py-3 text-gray-500 font-bold uppercase text-[10px] tracking-widest">
                                ← Volver
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="mt-4 text-center text-gray-700 text-[8px] font-bold uppercase tracking-[0.3em]">
            Logística Optimizada • v2.6
        </footer>
    </div>

    <script>
        // CONFIGURACIÓN INTERNA INTEGRADA
        const FIXED_BASE_ID = 'appwPbjGYCk6xoeWd'; 
        const FIXED_TABLE_ID = 'tblcKlCDPaoYiUDxw'; 

        // ESTADO
        let credentials = { pat: '', baseId: FIXED_BASE_ID, tableId: FIXED_TABLE_ID };
        let currentMode = 'scanner'; 
        let html5QrCode = null;
        let foundRecord = null;
        let isListening = false;
        let detectionTimer = null;
        let searchTimer = null;

        const dom = {
            config: document.getElementById('config-screen'),
            main: document.getElementById('main-screen'),
            scanner: document.getElementById('section-scanner'),
            manual: document.getElementById('section-manual'),
            confirmation: document.getElementById('confirmation-zone'),
            list: document.getElementById('suggestions-list'),
            badge: document.getElementById('count-badge'),
            searchInput: document.getElementById('manual-search-input'),
            foundId: document.getElementById('found-box-id'),
            msg: document.getElementById('message-container'),
            placeholder: document.getElementById('scanner-placeholder'),
            flash: document.getElementById('flash-layer'),
            reticle: document.getElementById('reticle'),
            patInput: document.getElementById('pat')
        };

        // FUNCIÓN ROBUSTA PARA EVITAR [object Object]
        const safeString = (val) => {
            if (val === null || val === undefined) return '';
            if (Array.isArray(val)) return safeString(val[0]);
            if (typeof val === 'object') {
                // Airtable a veces devuelve objetos en Lookups o fórmulas
                return val.name || val.text || val.value || JSON.stringify(val);
            }
            return String(val);
        };

        const showMessage = (text, type = 'info') => {
            const displayMessage = typeof text === 'object' ? (text.message || JSON.stringify(text)) : text;
            const colors = { success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-yellow-500 text-black', info: 'bg-indigo-600' };
            dom.msg.innerHTML = `<div class="p-4 ${colors[type]} text-white font-black rounded-xl mb-4 text-center animate-fade-in shadow-lg text-[10px] uppercase tracking-widest">${displayMessage}</div>`;
            if (type !== 'info') setTimeout(() => { if (dom.msg.innerText.includes(displayMessage)) dom.msg.innerHTML = ''; }, 3000);
        };

        const fetchAirtable = async (endpoint, options = {}) => {
            const url = `https://api.airtable.com/v0/${credentials.baseId}/${credentials.tableId}${endpoint}`;
            const res = await fetch(url, {
                ...options,
                headers: { 'Authorization': `Bearer ${credentials.pat}`, 'Content-Type': 'application/json', ...options.headers }
            });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.error?.message || `Error ${res.status}`);
            }
            return res.json();
        };

        const searchBox = async (id) => {
            if (!id || foundRecord) return;
            const cleanId = safeString(id);
            try {
                showMessage(`Buscando ${cleanId}...`, 'info');
                const formula = `{ID_Caja} = '${cleanId.trim().replace(/'/g, "\\'")}'`;
                const data = await fetchAirtable(`?filterByFormula=${encodeURIComponent(formula)}&maxRecords=1`);
                
                if (data.records.length > 0) {
                    const record = data.records[0];
                    if (record.fields.Status_arribo) {
                        showMessage("Caja ya registrada", "warning");
                    } else {
                        showConfirmation(record);
                    }
                } else {
                    showMessage("ID no encontrado", "error");
                }
            } catch (e) { showMessage(e.message || e, "error"); }
            finally { isListening = false; }
        };

        const refreshList = async (query = '') => {
            try {
                dom.list.innerHTML = '<div class="p-8 text-center text-gray-700 text-[9px] font-black uppercase tracking-widest animate-pulse">Sincronizando...</div>';
                let formula = '{Status_arribo} != 1';
                if (query.trim()) {
                    formula = `AND(SEARCH(LOWER("${query.replace(/"/g, '\\"')}") , LOWER({ID_Caja} & "")), {Status_arribo} != 1)`;
                }
                const data = await fetchAirtable(`?filterByFormula=${encodeURIComponent(formula)}&maxRecords=50&sort[0][field]=ID_Caja`);
                
                dom.list.innerHTML = '';
                dom.badge.innerText = data.records.length;
                if (data.records.length === 0) {
                    dom.list.innerHTML = '<div class="p-10 text-center text-gray-700 text-[9px] font-black uppercase tracking-widest">Sin pendientes</div>';
                    return;
                }
                data.records.forEach(rec => {
                    const li = document.createElement('li');
                    li.className = 'p-5 hover:bg-indigo-600/10 cursor-pointer flex justify-between items-center transition-all active:bg-indigo-600';
                    const boxId = safeString(rec.fields.ID_Caja);
                    li.innerHTML = `<span class="font-bold tracking-tight text-white text-sm">${boxId}</span><span class="text-indigo-500 font-black text-[8px] uppercase tracking-widest">Ver →</span>`;
                    li.onclick = () => showConfirmation(rec);
                    dom.list.appendChild(li);
                });
            } catch (e) { showMessage(e.message || e, 'error'); }
        };

        const showConfirmation = (record) => {
            foundRecord = record;
            dom.foundId.innerText = safeString(record.fields.ID_Caja);
            dom.confirmation.classList.remove('hidden');
            dom.msg.innerHTML = '';
            stopScanner();
        };

        const hideConfirmation = () => {
            foundRecord = null;
            dom.confirmation.classList.add('hidden');
            if (currentMode === 'scanner') startScanner();
            else refreshList(dom.searchInput.value);
        };

        const startScanner = async () => {
            dom.placeholder.classList.add('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            if (html5QrCode.isScanning) return;

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 24, qrbox: { width: 320, height: 120 }, aspectRatio: 1.333333 },
                    (text) => {
                        dom.reticle.classList.add('detecting');
                        clearTimeout(detectionTimer);
                        detectionTimer = setTimeout(() => dom.reticle.classList.remove('detecting'), 700);

                        if (isListening) {
                            isListening = false;
                            dom.flash.classList.add('flash-active');
                            setTimeout(() => dom.flash.classList.remove('flash-active'), 400);
                            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                            searchBox(text);
                        }
                    },
                    () => {}
                );
            } catch (err) {
                dom.placeholder.classList.remove('hidden');
                showMessage("Cámara no disponible", "error");
            }
        };

        const stopScanner = async () => {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.stop(); } catch (e) {}
            }
            dom.placeholder.classList.remove('hidden');
        };

        const switchMode = (mode) => {
            currentMode = mode;
            document.getElementById('tab-scanner').className = `flex-1 py-3 font-black text-[10px] uppercase tracking-widest rounded-xl transition-all ${mode === 'scanner' ? 'bg-indigo-600 text-white shadow-lg' : 'text-gray-500'}`;
            document.getElementById('tab-manual').className = `flex-1 py-3 font-black text-[10px] uppercase tracking-widest rounded-xl transition-all ${mode === 'manual' ? 'bg-indigo-600 text-white shadow-lg' : 'text-gray-500'}`;
            
            dom.confirmation.classList.add('hidden');
            dom.msg.innerHTML = '';
            if (mode === 'scanner') {
                dom.manual.classList.add('hidden');
                dom.scanner.classList.remove('hidden');
                startScanner();
            } else {
                stopScanner();
                dom.scanner.classList.add('hidden');
                dom.manual.classList.remove('hidden');
                refreshList(dom.searchInput.value);
            }
        };

        // EVENTOS
        document.getElementById('btn-capture').onclick = () => {
            if (isListening) return;
            isListening = true;
            showMessage("Escaneando...", "info");
            setTimeout(() => { if(isListening) { isListening = false; showMessage("Centra el código", "warning"); } }, 4000);
        };

        document.getElementById('btn-start-camera').onclick = startScanner;
        document.getElementById('tab-scanner').onclick = () => switchMode('scanner');
        document.getElementById('tab-manual').onclick = () => switchMode('manual');
        document.getElementById('btn-cancel-confirmation').onclick = hideConfirmation;

        document.getElementById('config-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'VERIFICANDO...';
            btn.disabled = true;
            credentials.pat = dom.patInput.value;
            try {
                await fetchAirtable('?maxRecords=1');
                localStorage.setItem('ab_pat_v2', credentials.pat);
                dom.config.classList.add('hidden');
                dom.main.classList.remove('hidden');
                switchMode('scanner');
            } catch (err) {
                document.getElementById('config-error').innerText = err.message || "Token no válido";
                document.getElementById('config-error').classList.remove('hidden');
                btn.innerText = 'Activar Terminal';
                btn.disabled = false;
            }
        };

        document.getElementById('btn-clear-config').onclick = () => { 
            if(confirm('¿Cerrar sesión en esta unidad?')){ 
                localStorage.clear(); 
                location.reload(); 
            } 
        };

        document.getElementById('btn-confirm-arribo').onclick = async () => {
            const btn = document.getElementById('btn-confirm-arribo');
            btn.disabled = true; btn.innerText = 'GUARDANDO...';
            try {
                await fetchAirtable(`/${foundRecord.id}`, { method: 'PATCH', body: JSON.stringify({ fields: { Status_arribo: true } }) });
                showMessage('Arribo confirmado', 'success');
                hideConfirmation();
            } catch (e) {
                showMessage(e.message || e, 'error');
                btn.disabled = false; btn.innerText = 'Confirmar Ingreso';
            }
        };

        dom.searchInput.oninput = (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => refreshList(e.target.value), 400);
        };

        window.onload = () => {
            const p = localStorage.getItem('ab_pat_v2');
            if (p) {
                credentials.pat = p;
                dom.main.classList.remove('hidden');
                switchMode('scanner');
            } else {
                dom.config.classList.remove('hidden');
            }
        };
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
