
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística Bodega | Gestión de Arribos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes flashEffect {
            0% { background: rgba(255,255,255,0); }
            50% { background: rgba(255,255,255,0.8); }
            100% { background: rgba(255,255,255,0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .flash-active { animation: flashEffect 0.4s ease-out; }
        
        #reader video {
            border-radius: 20px;
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        #reader { border: none !important; background: #000; }
        
        /* Retícula de Enfoque */
        .focus-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 150px;
            pointer-events: none;
            z-index: 45;
        }
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.4);
            transition: all 0.2s ease;
        }
        .detecting .corner {
            border-color: #22c55e !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        .corner-tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .corner-tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
        .corner-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
        .corner-br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

        .shutter-btn {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-indigo-500">

    <!-- PANTALLA DE CONFIGURACIÓN -->
    <div id="config-screen" class="hidden flex flex-col items-center justify-center min-h-screen p-6">
        <div class="w-full max-w-md bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-700">
            <h1 class="text-3xl font-black text-center mb-2 tracking-tight">Setup Airtable</h1>
            <p class="text-center text-gray-400 mb-8 text-sm">Configura tu terminal logística</p>
            
            <form id="config-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Airtable Token (PAT)</label>
                    <input type="password" id="pat" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-2xl p-5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder-gray-700" placeholder="pat...">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Base ID</label>
                    <input type="text" id="baseId" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-2xl p-5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder-gray-700" placeholder="app...">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Table ID</label>
                    <input type="text" id="tableId" required class="w-full bg-gray-900 border border-gray-700 text-white rounded-2xl p-5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder-gray-700" placeholder="tbl...">
                </div>
                
                <div id="config-error" class="hidden p-4 bg-red-900/30 border border-red-700/50 text-red-400 rounded-2xl text-xs text-center font-bold"></div>
                
                <button type="submit" class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl transition-all shadow-xl uppercase tracking-widest text-xs">
                    Conectar Terminal
                </button>
            </form>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="main-screen" class="hidden min-h-screen flex flex-col p-4">
        <header class="flex justify-between items-center mb-4 max-w-2xl mx-auto w-full px-2">
            <div class="flex flex-col">
                <h1 class="text-xl font-black tracking-tighter">BODEGA<span class="text-indigo-500">PRO</span></h1>
                <span class="text-[8px] text-gray-600 font-black uppercase tracking-[0.3em]">Logística Activa</span>
            </div>
            <button id="btn-clear-config" class="text-[8px] font-black text-gray-600 hover:text-red-400 uppercase tracking-widest border border-gray-800 px-4 py-1.5 rounded-full transition-all bg-black/40">
                Salir
            </button>
        </header>

        <main class="w-full max-w-2xl mx-auto bg-gray-800 rounded-[2rem] shadow-2xl flex-grow flex flex-col border border-gray-700 overflow-hidden relative">
            <!-- Tabs -->
            <div class="flex bg-gray-900/90 p-1 m-3 rounded-2xl border border-gray-700/50">
                <button id="tab-scanner" class="flex-1 py-3 font-black text-[9px] uppercase tracking-widest rounded-xl transition-all bg-indigo-600 text-white shadow-lg">Cámara</button>
                <button id="tab-manual" class="flex-1 py-3 font-black text-[9px] uppercase tracking-widest rounded-xl transition-all text-gray-500 hover:text-white">Lista Pendientes</button>
            </div>

            <div class="px-5 pb-5 flex-grow flex flex-col">
                <div id="message-container"></div>

                <!-- Sección Scanner -->
                <div id="section-scanner" class="flex-grow flex flex-col">
                    <!-- Contenedor de Video -->
                    <div id="reader-container" class="w-full aspect-video relative bg-black rounded-3xl overflow-hidden border border-gray-700 shadow-inner">
                        <div id="reader" class="w-full h-full"></div>
                        
                        <!-- Retícula de Enfoque -->
                        <div id="reticle" class="focus-frame">
                            <div class="corner corner-tl"></div>
                            <div class="corner corner-tr"></div>
                            <div class="corner corner-bl"></div>
                            <div class="corner corner-br"></div>
                        </div>

                        <div id="flash-layer" class="absolute inset-0 pointer-events-none z-40"></div>

                        <!-- Estado Inicial Cámara -->
                        <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-8 text-center bg-gray-900 z-50">
                            <button id="btn-start-camera" class="bg-indigo-600 hover:bg-indigo-500 px-8 py-4 rounded-2xl font-black text-[10px] shadow-2xl uppercase tracking-widest transition-all">
                                Activar Cámara
                            </button>
                        </div>
                    </div>

                    <!-- Controles Scanner (Bajo la imagen) -->
                    <div id="scanner-controls" class="mt-6 flex flex-col items-center">
                        <button id="btn-capture" class="shutter-btn bg-white active:scale-95 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center transition-all shadow-xl">
                            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121A2 2 0 0011.172 3H8.828a2 2 0 00-1.414.586L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                        </button>
                        <p class="mt-4 text-gray-500 text-[9px] font-black uppercase tracking-[0.3em]">Centrar código y presionar botón</p>
                    </div>
                </div>

                <!-- Sección Lista Manual -->
                <div id="section-manual" class="hidden flex-grow flex flex-col">
                    <div class="mb-4">
                        <input type="text" id="manual-search-input" class="w-full bg-gray-900 border border-gray-700 text-white rounded-2xl p-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder-gray-700" placeholder="Buscar ID de caja...">
                    </div>
                    <div class="flex-grow bg-gray-900 rounded-2xl border border-gray-700 flex flex-col overflow-hidden">
                        <div class="px-5 py-3 bg-gray-800/40 border-b border-gray-700 flex justify-between items-center">
                            <h3 class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Disponibles</h3>
                            <span id="count-badge" class="bg-indigo-600/10 text-indigo-400 text-[9px] px-2.5 py-1 rounded-full font-black border border-indigo-500/20">0</span>
                        </div>
                        <ul id="suggestions-list" class="overflow-y-auto max-h-[300px] divide-y divide-gray-800/50">
                            <!-- Items -->
                        </ul>
                    </div>
                </div>

                <!-- Modal de Confirmación -->
                <div id="confirmation-zone" class="hidden mt-2 animate-fade-in">
                    <div class="bg-indigo-600/5 border border-indigo-500/20 p-8 rounded-[2rem] text-center shadow-inner">
                        <p class="text-indigo-400 text-[8px] font-black uppercase tracking-[0.4em] mb-4">Caja Identificada</p>
                        <h2 id="found-box-id" class="text-3xl font-black text-white mb-8 tracking-tighter break-all">ID_BOX</h2>
                        <div class="flex flex-col gap-3">
                            <button id="btn-confirm-arribo" class="w-full py-4 bg-green-600 hover:bg-green-500 text-white font-black text-lg rounded-2xl transition-all shadow-xl uppercase tracking-widest active:scale-95">
                                CONFIRMAR INGRESO
                            </button>
                            <button id="btn-cancel-confirmation" class="w-full py-2 text-gray-600 font-bold uppercase text-[9px] tracking-widest hover:text-gray-400">
                                ← Cancelar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- ESTADO ---
        let credentials = { pat: '', baseId: '', tableId: '' };
        let currentMode = 'scanner'; 
        let html5QrCode = null;
        let foundRecord = null;
        let isListening = false;
        let searchTimer = null;

        const dom = {
            config: document.getElementById('config-screen'),
            main: document.getElementById('main-screen'),
            scanner: document.getElementById('section-scanner'),
            manual: document.getElementById('section-manual'),
            confirmation: document.getElementById('confirmation-zone'),
            list: document.getElementById('suggestions-list'),
            badge: document.getElementById('count-badge'),
            searchInput: document.getElementById('manual-search-input'),
            foundId: document.getElementById('found-box-id'),
            msg: document.getElementById('message-container'),
            placeholder: document.getElementById('scanner-placeholder'),
            flash: document.getElementById('flash-layer'),
            reticle: document.getElementById('reticle'),
            patInput: document.getElementById('pat'),
            baseInput: document.getElementById('baseId'),
            tableInput: document.getElementById('tableId')
        };

        // --- UTILIDADES ---
        const safeString = (val) => {
            if (val === null || val === undefined) return '';
            if (Array.isArray(val)) return safeString(val[0]);
            if (typeof val === 'object') return val.name || val.text || JSON.stringify(val);
            return String(val);
        };

        const showMessage = (text, type = 'info') => {
            const colors = { success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-yellow-500 text-black', info: 'bg-indigo-600' };
            dom.msg.innerHTML = `<div class="p-4 ${colors[type]} text-white font-black rounded-xl mb-4 text-center animate-fade-in shadow-lg text-[10px] uppercase tracking-widest">${text}</div>`;
            if (type !== 'info') setTimeout(() => { if (dom.msg.innerText.includes(text)) dom.msg.innerHTML = ''; }, 3500);
        };

        const fetchAirtable = async (endpoint, options = {}) => {
            const url = `https://api.airtable.com/v0/${credentials.baseId}/${credentials.tableId}${endpoint}`;
            const res = await fetch(url, {
                ...options,
                headers: { 'Authorization': `Bearer ${credentials.pat}`, 'Content-Type': 'application/json', ...options.headers }
            });
            if (!res.ok) throw new Error('Error en Airtable');
            return res.json();
        };

        const searchBox = async (id) => {
            if (!id || foundRecord) return;
            const cleanId = safeString(id);
            try {
                showMessage(`Procesando ${cleanId}...`, 'info');
                const formula = `{ID_Caja} = '${cleanId.trim().replace(/'/g, "\\'")}'`;
                const data = await fetchAirtable(`?filterByFormula=${encodeURIComponent(formula)}&maxRecords=1`);
                
                if (data.records.length > 0) {
                    const record = data.records[0];
                    if (record.fields.Status_arribo) {
                        showMessage("Caja ya registrada", "warning");
                    } else {
                        showConfirmation(record);
                    }
                } else {
                    showMessage("ID no encontrado en base", "error");
                }
            } catch (e) {
                showMessage(e.message, "error");
            } finally {
                isListening = false;
                dom.reticle.classList.remove('detecting');
            }
        };

        const refreshList = async (query = '') => {
            try {
                dom.list.innerHTML = '<div class="p-8 text-center text-gray-700 text-[9px] font-black uppercase tracking-widest">Sincronizando...</div>';
                let formula = '{Status_arribo} != 1';
                if (query.trim()) {
                    formula = `AND(SEARCH(LOWER("${query.replace(/"/g, '\\"')}") , LOWER({ID_Caja} & "")), {Status_arribo} != 1)`;
                }
                const data = await fetchAirtable(`?filterByFormula=${encodeURIComponent(formula)}&maxRecords=50&sort[0][field]=ID_Caja`);
                
                dom.list.innerHTML = '';
                dom.badge.innerText = data.records.length;
                if (data.records.length === 0) {
                    dom.list.innerHTML = '<div class="p-8 text-center text-gray-700 text-[9px] font-black uppercase tracking-widest">Sin resultados</div>';
                    return;
                }
                data.records.forEach(rec => {
                    const li = document.createElement('li');
                    li.className = 'p-4 hover:bg-indigo-600/10 cursor-pointer flex justify-between items-center transition-all active:bg-indigo-600';
                    const boxId = safeString(rec.fields.ID_Caja);
                    li.innerHTML = `<span class="font-bold tracking-tight text-white text-sm">${boxId}</span><span class="text-indigo-500 font-black text-[8px] uppercase tracking-widest">Ver →</span>`;
                    li.onclick = () => showConfirmation(rec);
                    dom.list.appendChild(li);
                });
            } catch (e) { showMessage(e.message, 'error'); }
        };

        const showConfirmation = (record) => {
            foundRecord = record;
            dom.foundId.innerText = safeString(record.fields.ID_Caja);
            dom.scanner.classList.add('hidden');
            dom.manual.classList.add('hidden');
            dom.confirmation.classList.remove('hidden');
            dom.msg.innerHTML = '';
            stopScanner();
        };

        const hideConfirmation = () => {
            foundRecord = null;
            dom.confirmation.classList.add('hidden');
            if (currentMode === 'scanner') {
                dom.scanner.classList.remove('hidden');
                startScanner();
            } else {
                dom.manual.classList.remove('hidden');
                refreshList(dom.searchInput.value);
            }
        };

        // --- CAMERA ENGINE ---
        const startScanner = async () => {
            dom.placeholder.classList.add('hidden');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            
            if (html5QrCode.isScanning) return;

            try {
                // Rectangular qrbox (320x150)
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 320, height: 150 }, aspectRatio: 1.7777777778 },
                    (text) => {
                        if (isListening) {
                            isListening = false;
                            // Efectos visuales de detección exitosa
                            dom.reticle.classList.add('detecting');
                            dom.flash.classList.add('flash-active');
                            setTimeout(() => dom.flash.classList.remove('flash-active'), 400);
                            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                            searchBox(text);
                        }
                    },
                    () => {}
                );
            } catch (err) {
                dom.placeholder.classList.remove('hidden');
                showMessage("Permiso de cámara denegado", "error");
            }
        };

        const stopScanner = async () => {
            if (html5QrCode && html5QrCode.isScanning) {
                try { await html5QrCode.stop(); } catch (e) {}
            }
            dom.placeholder.classList.remove('hidden');
        };

        const switchMode = (mode) => {
            currentMode = mode;
            document.getElementById('tab-scanner').className = `flex-1 py-3 font-black text-[9px] uppercase tracking-widest rounded-xl transition-all ${mode === 'scanner' ? 'bg-indigo-600 text-white shadow-lg' : 'text-gray-500'}`;
            document.getElementById('tab-manual').className = `flex-1 py-3 font-black text-[9px] uppercase tracking-widest rounded-xl transition-all ${mode === 'manual' ? 'bg-indigo-600 text-white shadow-lg' : 'text-gray-500'}`;
            
            dom.confirmation.classList.add('hidden');
            dom.msg.innerHTML = '';
            if (mode === 'scanner') {
                dom.manual.classList.add('hidden');
                dom.scanner.classList.remove('hidden');
                startScanner();
            } else {
                stopScanner();
                dom.scanner.classList.add('hidden');
                dom.manual.classList.remove('hidden');
                refreshList(dom.searchInput.value);
            }
        };

        // --- HANDLERS ---
        document.getElementById('btn-capture').onclick = () => {
            if (isListening) return;
            isListening = true;
            showMessage("Capturando...", "info");
            // Timer de seguridad por si no hay nada que leer
            setTimeout(() => { 
                if(isListening) { 
                    isListening = false; 
                    showMessage("No se detectó código", "warning"); 
                    dom.reticle.classList.remove('detecting');
                } 
            }, 3000);
        };

        document.getElementById('btn-start-camera').onclick = startScanner;
        document.getElementById('tab-scanner').onclick = () => switchMode('scanner');
        document.getElementById('tab-manual').onclick = () => switchMode('manual');
        document.getElementById('btn-cancel-confirmation').onclick = hideConfirmation;

        document.getElementById('config-form').onsubmit = async (e) => {
            e.preventDefault();
            credentials = { pat: dom.patInput.value, baseId: dom.baseInput.value, tableId: dom.tableInput.value };
            try {
                await fetchAirtable('?maxRecords=1');
                localStorage.setItem('ab_pat', credentials.pat);
                localStorage.setItem('ab_base', credentials.baseId);
                localStorage.setItem('ab_table', credentials.tableId);
                dom.config.classList.add('hidden');
                dom.main.classList.remove('hidden');
                switchMode('scanner');
            } catch (err) {
                document.getElementById('config-error').innerText = "Credenciales inválidas";
                document.getElementById('config-error').classList.remove('hidden');
            }
        };

        document.getElementById('btn-clear-config').onclick = () => { if(confirm('¿Desvincular terminal?')){ localStorage.clear(); location.reload(); } };

        document.getElementById('btn-confirm-arribo').onclick = async () => {
            const btn = document.getElementById('btn-confirm-arribo');
            btn.disabled = true; btn.innerText = 'GUARDANDO...';
            try {
                await fetchAirtable(`/${foundRecord.id}`, { method: 'PATCH', body: JSON.stringify({ fields: { Status_arribo: true } }) });
                showMessage('¡Ingreso exitoso!', 'success');
                hideConfirmation();
            } catch (e) {
                showMessage(e.message, 'error');
                btn.disabled = false; btn.innerText = 'CONFIRMAR INGRESO';
            }
        };

        dom.searchInput.oninput = (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => refreshList(e.target.value), 400);
        };

        window.onload = () => {
            const p = localStorage.getItem('ab_pat'), b = localStorage.getItem('ab_base'), t = localStorage.getItem('ab_table');
            if (p && b && t) {
                credentials = { pat: p, baseId: b, tableId: t };
                dom.patInput.value = p; dom.baseInput.value = b; dom.tableInput.value = t;
                dom.main.classList.remove('hidden');
                switchMode('scanner');
            } else {
                dom.config.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
